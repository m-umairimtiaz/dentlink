services:
  - type: web
    name: dentlink
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: dentlink-db
          property: connectionString

databases:
  - name: dentlink-db
    databaseName: dentlink
    plan: free
